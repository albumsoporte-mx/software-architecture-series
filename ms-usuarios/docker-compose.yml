services:
  ms-usuarios:
    build: .
    container_name: api_usuarios
    labels:
      # 1. Rompemos el aislamiento: "¡Oye Traefik, mírame, existo!"
      - "traefik.enable=true"
      # 2. Definimos la ruta web por la que responderá este servicio
      - "traefik.http.routers.ms-usuarios.rule=PathPrefix(`/api/usuarios`)"
      # 3. Le indicamos a Traefik a qué puerto interno del contenedor enviar el tráfico
      - "traefik.http.services.ms-usuarios.loadbalancer.server.port=8000"

      # --- LA MAGIA NUEVA (Strip Prefix) ---
      # 1. Creamos un "middleware" que corta el prefijo de la URL
      - "traefik.http.middlewares.strip-usuarios.stripprefix.prefixes=/api/usuarios"
      # 2. Le asignamos ese middleware a nuestra ruta
      - "traefik.http.routers.ms-usuarios.middlewares=strip-usuarios"
      
    networks:
      - red_observabilidad

# Conectamos este trabajador a la misma red de nuestro portero
networks:
  red_observabilidad:
    external: true